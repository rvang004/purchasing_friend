<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Purchasing Friend Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3">
    <a class="navbar-brand" href="#">Purchasing Friend</a>
</nav>

<div class="container-fluid py-3">

    <ul class="nav nav-tabs" id="mainTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tasks-tab" data-bs-toggle="tab"
                    data-bs-target="#tasks" type="button" role="tab">
                Tasks
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="scheduler-tab" data-bs-toggle="tab"
                    data-bs-target="#scheduler" type="button" role="tab">
                Scheduler
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="logs-tab" data-bs-toggle="tab"
                    data-bs-target="#logs" type="button" role="tab">
                Logs
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="accounts-tab" data-bs-toggle="tab"
                    data-bs-target="#accounts" type="button" role="tab">
                Accounts
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="system-tab" data-bs-toggle="tab"
                    data-bs-target="#system" type="button" role="tab">
                System Status
            </button>
        </li>
    </ul>

    <div class="tab-content mt-3">

        <!-- TASKS TAB -->
        <div class="tab-pane fade show active" id="tasks" role="tabpanel">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>Tasks</h4>
                <button class="btn btn-success" onclick="openTaskModal()">+ New Task</button>
            </div>

            <div class="mb-2">
                <label class="form-label me-2">Account filter:</label>
                <select id="accountFilter" class="form-select d-inline-block w-auto"
                        onchange="loadTasks()">
                    <option value="">All accounts</option>
                </select>
            </div>

            <div class="card">
                <div class="card-body table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                        <tr>
                            <th>Retailer</th>
                            <th>Product</th>
                            <th>Account</th>
                            <th>Time</th>
                            <th>Timezone</th>
                            <th>Desired</th>
                            <th>Max Qty</th>
                            <th>Max Price</th>
                            <th>Max Spend</th>
                            <th>Enabled</th>
                            <th>Last Run</th>
                            <th>Actions</th>
                        </tr>
