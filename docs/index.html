<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Purchasing Friend Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black px-3">
    <span class="navbar-brand mb-0 h1">Purchasing Friend Dashboard</span>
</nav>

<div class="container py-4">

    <!-- Tabs -->
    <ul class="nav nav-tabs" id="dashboardTabs">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tasksTab">Tasks</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#schedulerTab">Scheduler</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#logsTab">Logs</button>
        </li>
    </ul>

    <div class="tab-content mt-4">

        <!-- TASKS TAB -->
        <div class="tab-pane fade show active" id="tasksTab">
            <h3>Tasks</h3>

            <button class="btn btn-success mb-3" onclick="openTaskModal()">+ Add Task</button>

            <table class="table table-dark table-striped">
                <thead>
                    <tr>
                        <th>Retailer</th>
                        <th>Product URL</th>
                        <th>Account</th>
                        <th>Schedule</th>
                        <th>Enabled</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody"></tbody>
            </table>
        </div>

        <!-- SCHEDULER TAB -->
        <div class="tab-pane fade" id="schedulerTab">
            <h3>Scheduler</h3>

            <p><strong>Status:</strong> <span id="schedulerStatus">Loading...</span></p>
            <p><strong>Next Run:</strong> <span id="nextRun">Loading...</span></p>

            <button class="btn btn-primary" onclick="startScheduler()">Start Scheduler</button>
            <button class="btn btn-danger" onclick="stopScheduler()">Stop Scheduler</button>
        </div>

        <!-- LOGS TAB -->
        <div class="tab-pane fade" id="logsTab">
            <h3>Logs</h3>
            <pre id="logOutput" class="bg-black p-3 rounded" style="height: 400px; overflow-y: scroll;"></pre>
        </div>

    </div>
</div>

<!-- Task Modal -->
<div class="modal fade" id="taskModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content bg-dark text-light">
      <div class="modal-header">
        <h5 class="modal-title">Task</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">

        <input type="hidden" id="taskId">

        <div class="mb-3">
            <label class="form-label">Retailer</label>
            <input class="form-control" id="retailer">
        </div>

        <div class="mb-3">
            <label class="form-label">Product URL</label>
            <input class="form-control" id="productUrl">
        </div>

        <div class="mb-3">
            <label class="form-label">Account Email</label>
            <input class="form-control" id="accountEmail">
        </div>

        <div class="mb-3">
            <label class="form-label">Schedule Time (e.g. 3:00 PM CST)</label>
            <input class="form-control" id="scheduleTime">
        </div>

        <div class="mb-3">
            <label class="form-label">Max Quantity</label>
            <input class="form-control" id="maxQty" type="number">
        </div>

        <div class="mb-3">
            <label class="form-label">Enabled</label>
            <select class="form-control" id="enabled">
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>
        </div>

      </div>
      <div class="modal-footer">
        <button class="btn btn-success" onclick="saveTask()">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
