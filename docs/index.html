<!DOCTYPE html>
<html>
<head>
    <title>Purchasing Friend Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status-running { color: green; font-weight: bold; }
        .status-stopped { color: red; font-weight: bold; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
        th { background: #f0f0f0; }
        textarea { width: 100%; height: 200px; font-family: monospace; }
        .btn { padding: 6px 10px; margin: 2px; cursor: pointer; }
    </style>
</head>
<body>

<h1>Purchasing Friend Dashboard</h1>

<div>
    <button class="btn" onclick="start()">Start Scheduler</button>
    <button class="btn" onclick="stop()">Stop Scheduler</button>
    <span id="status" class="status-stopped">Status: Unknown</span>
</div>

<h2>Tasks</h2>
<div>
    <button class="btn" onclick="showNewTaskForm()">New Task</button>
</div>

<div id="task-form" style="display:none; margin-top:10px;">
    <input id="task-name" placeholder="Name" />
    <input id="task-hour" type="number" min="0" max="23" value="9" />
    <input id="task-minute" type="number" min="0" max="59" value="0" />
    <label>
        <input id="task-enabled" type="checkbox" checked /> Enabled
    </label>
    <button class="btn" onclick="createTask()">Save</button>
    <button class="btn" onclick="hideNewTaskForm()">Cancel</button>
</div>

<table id="tasks-table">
    <thead>
        <tr>
            <th>ID</th><th>Name</th><th>Time</th><th>Enabled</th><th>Last Run</th><th>Actions</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<h2>Logs</h2>
<textarea id="logs" readonly></textarea>

<script>
    // CHANGE THIS WHEN DEPLOYING
    const API_URL = "https://purchasingfriend-production.up.railway.app";


    async function start() {
        await fetch(API + '/start', {method: 'POST'});
        await updateStatus();
    }

    async function stop() {
        await fetch(API + '/stop', {method: 'POST'});
        await updateStatus();
    }

    async function updateStatus() {
        let res = await fetch(API + '/status');
        let data = await res.json();
        let el = document.getElementById('status');
        if (data.running) {
            el.textContent = 'Status: Running';
            el.className = 'status-running';
        } else {
            el.textContent = 'Status: Stopped';
            el.className = 'status-stopped';
        }
    }

    function showNewTaskForm() {
        document.getElementById('task-form').style.display = 'block';
    }
    function hideNewTaskForm() {
        document.getElementById('task-form').style.display = 'none';
    }

    async function loadTasks() {
        let res = await fetch(API + '/tasks');
        let tasks = await res.json();
        let tbody = document.querySelector('#tasks-table tbody');
        tbody.innerHTML = '';
        for (let t of tasks) {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${t.id}</td>
                <td>${t.name}</td>
                <td>${String(t.hour).padStart(2,'0')}:${String(t.minute).padStart(2,'0')}</td>
                <td>${t.enabled ? 'Yes' : 'No'}</td>
                <td>${t.last_run || ''}</td>
                <td>
                    <button class="btn" onclick="toggleTask(${t.id}, ${t.enabled ? 'false' : 'true'})">
                        ${t.enabled ? 'Disable' : 'Enable'}
                    </button>
                    <button class="btn" onclick="deleteTask(${t.id})">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        }
    }

    async function createTask() {
        let name = document.getElementById('task-name').value || 'New Task';
        let hour = parseInt(document.getElementById('task-hour').value || '9');
        let minute = parseInt(document.getElementById('task-minute').value || '0');
        let enabled = document.getElementById('task-enabled').checked;

        await fetch(API + '/tasks', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, hour, minute, enabled})
        });
        hideNewTaskForm();
        await loadTasks();
    }

    async function toggleTask(id, enabled) {
        await fetch(API + '/tasks/' + id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({enabled})
        });
        await loadTasks();
    }

    async function deleteTask(id) {
        await fetch(API + '/tasks/' + id, {method: 'DELETE'});
        await loadTasks();
    }

    async function loadLogs() {
        let res = await fetch(API + '/logs');
        let data = await res.json();
        let textarea = document.getElementById('logs');
        textarea.value = data.lines.join('');
        textarea.scrollTop = textarea.scrollHeight;
    }

    async function tick() {
        await updateStatus();
        await loadTasks();
        await loadLogs();
    }

    setInterval(tick, 5000);
    tick();
</script>

</body>
</html>
