<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Purchasing Friend Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black px-3">
    <span class="navbar-brand mb-0 h1">Purchasing Friend Dashboard</span>
</nav>

<div class="container py-4">

    <!-- Add Task Button -->
    <div class="text-end mb-3">
        <button class="btn btn-success btn-lg" onclick="openTaskModal()">+ New Task</button>
    </div>

    <!-- Task Table -->
    <div class="card bg-secondary shadow">
        <div class="card-body">
            <h4 class="mb-3">Tasks</h4>

            <table class="table table-dark table-striped">
                <thead>
                    <tr>
                        <th>Retailer</th>
                        <th>Product URL</th>
                        <th>Account</th>
                        <th>Time</th>
                        <th>Timezone</th>
                        <th>Qty</th>
                        <th>Max Qty</th>
                        <th>Max Price</th>
                        <th>Max Spend</th>
                        <th>Enabled</th>
                        <th>Last Run</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Task Modal -->
<div class="modal fade" id="taskModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content bg-dark text-light">

      <div class="modal-header">
        <h5 class="modal-title">Task Editor</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <input type="hidden" id="taskId">

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Retailer</label>
                <select class="form-control" id="retailer">
                    <option>Walmart</option>
                    <option>Sam's</option>
                    <option>Target</option>
                </select>
            </div>

            <div class="col-md-8 mb-3">
                <label class="form-label">Product URL</label>
                <input class="form-control" id="productUrl">
            </div>
        </div>

        <h5 class="mt-4">Account Info</h5>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Account Label</label>
                <input class="form-control" id="accountLabel">
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Login Email</label>
                <input class="form-control" id="loginEmail">
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Login Password</label>
                <input type="password" class="form-control" id="loginPassword">
            </div>
        </div>

        <h5 class="mt-4">Schedule</h5>
        <div class="row">
            <div class="col-md-2 mb-3">
                <label class="form-label">Hour</label>
                <input type="number" class="form-control" id="hour" min="1" max="12">
            </div>

            <div class="col-md-2 mb-3">
                <label class="form-label">Minute</label>
                <input type="number" class="form-control" id="minute" min="0" max="59">
            </div>

            <div class="col-md-2 mb-3">
                <label class="form-label">Second</label>
                <input type="number" class="form-control" id="second" min="0" max="59">
            </div>

            <div class="col-md-2 mb-3">
                <label class="form-label">AM/PM</label>
                <select class="form-control" id="ampm">
                    <option>AM</option>
                    <option>PM</option>
                </select>
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Timezone</label>
                <select class="form-control" id="timezone">
                    <option>CST</option>
                    <option>EST</option>
                    <option>PST</option>
                    <option>MST</option>
                </select>
            </div>
        </div>

        <h5 class="mt-4">Limits</h5>
        <div class="row">
            <div class="col-md-3 mb-3">
                <label class="form-label">Desired Quantity</label>
                <input type="number" class="form-control" id="desiredQty">
            </div>

            <div class="col-md-3 mb-3">
                <label class="form-label">Max Quantity</label>
                <input type="number" class="form-control" id="maxQty">
            </div>

            <div class="col-md-3 mb-3">
                <label class="form-label">Max Price</label>
                <input type="number" class="form-control" id="maxPrice" step="0.01">
            </div>

            <div class="col-md-3 mb-3">
                <label class="form-label">Max Spend</label>
                <input type="number" class="form-control" id="maxSpend" step="0.01">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Enabled</label>
            <select class="form-control" id="enabled">
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>
        </div>

      </div>

      <div class="modal-footer">
